# Window colors
$active_border = rgba({{colors.primary.default.hex_stripped}}ee) rgba({{colors.secondary.default.hex_stripped}}ee) 45deg
$inactive_border = rgba({{colors.surface_variant.default.hex_stripped}}aa)

# Workspace colors
$active_workspace = rgba({{colors.primary.default.hex_stripped}}ee)
$inactive_workspace = rgba({{colors.surface_variant.default.hex_stripped}}aa)
$urgent_workspace = rgba({{colors.error.default.hex_stripped}}ee)

# Bar colors
$bar_background = rgba({{colors.surface.default.hex_stripped}}aa)
$bar_foreground = rgba({{colors.on_surface.default.hex_stripped}}ff)

# Notification colors
$notification_background = rgba({{colors.surface.default.hex_stripped}}ee)
$notification_foreground = rgba({{colors.on_surface.default.hex_stripped}}ff)
$notification_error = rgba({{colors.error.default.hex_stripped}}ff)
$notification_warning = rgba({{colors.tertiary.default.hex_stripped}}ff)

# Menu colors
$menu_background = rgba({{colors.surface.default.hex_stripped}}ee)
$menu_foreground = rgba({{colors.on_surface.default.hex_stripped}}ff)
$menu_selected = rgba({{colors.primary.default.hex_stripped}}ff)
