# Launch applications
bind = $superMod, Return, exec, $terminal
bind = $superMod, E, exec, $fileManager
bind = $superMod, R, exec, $menu
bind = $superMod, C, exec, $code
bind = $superMod, B, exec, $browser

# Rofi menus (consistent Super + D chords)
bind = $superMod, D, exec, $launcher
bind = $superMod SHIFT, D, exec, $powermenu
bind = $superMod ALT, D, global, quickshell:app_launcher

# Quickshell global shortcuts
bind = $superMod SHIFT, V, global, quickshell:clipboard_history
bind = $superMod, F1, global, quickshell:keybinds_help
bind = , Print, global, quickshell:take_screenshot
bind = $superMod, W, global, quickshell:wallpaper_picker


# Window management
bind = $superMod, Q, killactive,
bind = $superMod, M, exit,
bind = $superMod, V, togglefloating,
bind = $superMod, P, pseudo, # dwindle
bind = $altMod,Tab,focuscurrentorlast,
bind = $superMod,Tab, hyprexpo:expo, toggle
# Move focus with mainMod + arrow keys
bind = $superMod, left, movefocus, l
bind = $superMod, right, movefocus, r
bind = $superMod, up, movefocus, u
bind = $superMod, down, movefocus, d
bind = $superMod ALT, F, fullscreen
# Switch workspaces with mainMod + [0-7]
bind = $superMod, 1, workspace, 1
bind = $superMod, 2, workspace, 2
bind = $superMod, 3, workspace, 3
bind = $superMod, 4, workspace, 4
bind = $superMod, 5, workspace, 5
bind = $superMod, 6, workspace, 6
bind = $superMod, 7, workspace, 7

# Move active window to a workspace with mainMod + SHIFT + [0-7]
bind = $superMod SHIFT, 1, movetoworkspace, 1
bind = $superMod SHIFT, 2, movetoworkspace, 2
bind = $superMod SHIFT, 3, movetoworkspace, 3
bind = $superMod SHIFT, 4, movetoworkspace, 4
bind = $superMod SHIFT, 5, movetoworkspace, 5
bind = $superMod SHIFT, 6, movetoworkspace, 6
bind = $superMod SHIFT, 7, movetoworkspace, 7

# Example special workspace (scratchpad)
bind = $superMod, S, togglespecialworkspace, magic
bind = $superMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $superMod, mouse_down, workspace, e+1
bind = $superMod, mouse_up, workspace, e-1

# Scroll through windows in the current workspace with ALT + scroll
bind = ALT, mouse_down, movefocus, r
bind = ALT, mouse_up, movefocus, l

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $superMod, mouse:272, movewindow
bindm = $superMod, mouse:273, resizewindow

# ----- System ----- #

# Lock screen
bind = $superMod, L, exec, $lockCmd

# Speech-to-Text (Dictado por voz)
bind = $superMod ALT, V, exec, $sttCmd

# Clipboard
bind = $superMod ALT, C, exec, wl-paste | xargs -I {} $code {}

# Volume and brightness control
bindel = , XF86AudioRaiseVolume, global, quickshell:volume_up
bindel = , XF86AudioLowerVolume, global, quickshell:volume_down
bindel = , XF86AudioMute, global, quickshell:volume_mute
bindel = , XF86MonBrightnessUp, global, quickshell:brightness_up
bindel = , XF86MonBrightnessDown, global, quickshell:brightness_down

# Wallpaper controls
bind = $superMod SHIFT, W, exec, $wallpaperControl change
bind = $superMod ALT, W, exec, $wallpaperControl status

# Theme controls
bind = $superMod SHIFT, T, exec, $themeManager select
bind = $superMod CTRL, T, exec, $themeManager apply
bind = $superMod SHIFT, C, exec, $themeManager cursor
bind = $superMod ALT, T, exec, $themeManager current

# Mover la vista (scroll)
bind = $superMod, period,      layoutmsg, move +col
bind = $superMod, comma,       layoutmsg, move -col

# Mover ventanas
bind = $superMod SHIFT, period, layoutmsg, movewindowto r
bind = $superMod SHIFT, comma,  layoutmsg, movewindowto l
bind = $superMod SHIFT, up, layoutmsg, movewindowto u
bind = $superMod SHIFT, down, layoutmsg, movewindowto d

# Redimensionar columnas
bind = $superMod, equal,  layoutmsg, colresize +0.1
bind = $superMod, minus,  layoutmsg, colresize -0.1
bind = $superMod, R,      layoutmsg, colresize +conf   # cicla explicit_column_widths

# Fit y promote
bind = $superMod, F,  layoutmsg, fit active
bind = $superMod, P,  layoutmsg, promote         # saca ventana a su propia columna

# Swap columnas
bind = $superMod CTRL, period, layoutmsg, swapcol r
bind = $superMod CTRL, comma,  layoutmsg, swapcol l

#bind = , XF86PowerOff, exec, hyprctl dispatch dpms toggle
