# ============================================================================
# Layer rules
# ============================================================================

# Notification and launcher layers
layerrule = blur on, ignore_alpha 0.0, dim_around on, animation popin, match:namespace ^(rofi|dunst|swaync)$
layerrule = blur on, ignore_alpha 0.3, animation popin, match:namespace ^(swaync-control-center)$

# QuickShell layer surfaces
layerrule = blur on, ignore_alpha 0.3, match:namespace ^qs_.*$
layerrule = animation popin, match:namespace ^qs_.*$
